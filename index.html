<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Радар Моніторингу Загроз (Автономний)</title>
    <!-- Подключение библиотеки интерактивных карт Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #111; font-family: sans-serif; overflow: hidden; }
        #map { width: 100%; height: 100vh; background: #111; }
        .threat-icon { font-size: 32px; text-align: center; animation: pulse 1.5s infinite; }
        .r-rocket { filter: drop-shadow(0px 0px 10px #ff2222); }
        .r-bpla { filter: drop-shadow(0px 0px 10px #ff9900); }
        .r-boom { filter: drop-shadow(0px 0px 12px #ffff00); }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }
        #panel {
            position: absolute; top: 15px; left: 60px; z-index: 1000;
            background: rgba(20, 20, 20, 0.95); color: #fff; padding: 12px 18px;
            border-radius: 8px; border: 1px solid #333; font-size: 13px;
        }
        .dot { display: inline-block; width: 10px; height: 10px; background: #00ff00; border-radius: 50%; margin-right: 6px; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    </style>
</head>
<body>

<div id="panel">
    <span class="dot" id="dot"></span> <b id="title">Радар «Map Control»</b><br>
    <small id="status-text" style="color: #00ff00;">З'єднання з Telegram API...</small>
</div>

<div id="map"></div>

<!-- Скрипты для работы интерактивной карты -->
<script src="https://unpkg.com"></script>
<script>
    // Создание карты с центром в Украине
    const map = L.map('map').setView([48.3794, 31.1656], 6);

    // Подключение ночной темы карт от CartoDB
    L.tileLayer('https://{s}://{z}/{x}/{y}{r}.png', {
        attribution: '© CARTO', subdomains: 'abcd', maxZoom: 20
    }).addTo(map);

    // --- КОНФИГУРАЦИЯ БОТА ---
    const BOT_TOKEN = "8877187091:AAGUMfMKSCitFae9Tdn0J-Lm5Wyabv5Tv6w";
    let lastUpdateId = 0;
    let knownMarkers = {};

    // База городов на регулярных выражениях
    const LOCATIONS = [
        { pattern: /дніпр[оаіу]/, coords: [48.4647, 35.0462] },
        { pattern: /камʼянськ[оеау]|кам'янськ[оеау]/, coords: [48.5142, 34.6133] },
        { pattern: /харків[аіу]?/, coords: [50.0038, 36.2304] },
        { pattern: /полтав[аіу]/, coords: [49.5883, 34.5514] },
        { pattern: /київ[аіу]?/, coords: [50.4501, 30.5234] },
        { pattern: /запоріжж[яіу]/, coords: [47.8388, 35.1396] },
        { pattern: /одес[аіу]/, coords: [46.4825, 30.7233] },
        { pattern: /львів[аіу]?/, coords: [49.8397, 24.0297] },
        { pattern: /крив[ои]й р[іі]г|крив[ои]му розі/, coords: [47.9105, 33.3918] },
        { pattern: /миколаїв[аіу]?/, coords: [46.9750, 31.9946] },
        { pattern: /херсон[аіу]?/, coords: [46.6354, 32.6169] }
    ];

    function sound(type) {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator(); const gain = ctx.createGain();
        osc.type = type === 'ракета' ? 'sawtooth' : 'sine';
        osc.frequency.setValueAtTime(type === 'вибух' ? 180 : 500, ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(type === 'вибух' ? 30 : 900, ctx.currentTime + 0.5);
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.6);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + 0.6);
    }

    function spawn(lat, lng, type, text, msgId) {
        if (knownMarkers[msgId]) return;
        knownMarkers[msgId] = true;

        let emoji = '⚠️'; let cls = 'threat-icon';
        if(type === 'ракета') { emoji = '🚀'; cls += ' r-rocket'; }
        else if(type === 'бпла') { emoji = '🛸'; cls += ' r-bpla'; }
        else if(type === 'вибух') { emoji = '💥'; cls += ' r-boom'; }

        // ИСПРАВЛЕНО: Теперь тут стоят стабильные фиксированные массивы
        const icon = L.divIcon({ 
            html: '<div class="' + cls + '">' + emoji + '</div>', 
            iconSize:, 
            iconAnchor: [16, 16]
        });
        
        map.flyTo([lat, lng], 9, { duration: 2 });
        try { sound(type); } catch(e) {}

        const marker = L.marker([lat, lng], { icon: icon }).addTo(map)
            .bindPopup('<div style="color:#000; font-size:12px;"><b>ОПЕРАТИВНА ЗВОДКА:</b><br><br>' + text + '</div>')
            .openPopup();

        setTimeout(() => map.removeLayer(marker), 1200000);
    }

    async function checkTelegramUpdates() {
        try {
            const url = 'https://telegram.org' + BOT_TOKEN + '/getUpdates?offset=' + (lastUpdateId + 1) + '&timeout=5';
            const response = await fetch(url);
            const data = await response.json();

            if (!data.ok) {
                document.getElementById('status-text').style.color = '#ff3333';
                document.getElementById('status-text').innerText = "Помилка API: " + data.description;
                setTimeout(checkTelegramUpdates, 2000);
                return;
            }

            if (data.result.length > 0) {
                data.result.forEach(update => {
                    lastUpdateId = update.update_id;

                    let msg = update.channel_post || update.message;
                    if (!msg || !msg.text) return;

                    let text = msg.text.toLowerCase();
                    let msgId = msg.message_id;

                    if (['відбій', 'чисто', 'втрачено', 'загроза минула'].some(word => text.includes(word))) return;

                    let threatType = 'увага';
                    if (['ракета', 'ракет', 'калібр', 'балістика'].some(w => text.includes(w))) threatType = 'ракета';
                    else if (['шахед', 'бпла', 'дрон', 'мопед'].some(w => text.includes(w))) threatType = 'бпла';
                    else if (['вибух', 'бах', 'гучно'].some(w => text.includes(w))) threatType = 'вибух';

                    for (const loc of LOCATIONS) {
                        if (loc.pattern.test(text)) {
                            spawn(loc.coords, loc.coords, threatType, msg.text, msgId);
                            break;
                        }
                    }
                });
            }
            document.getElementById('status-text').style.color = '#00ff00';
            document.getElementById('status-text').innerText = 'Оновлено: ' + new Date().toLocaleTimeString() + '. Очікування повідомлень...';
        } catch (error) {
            console.error("Помилка API Telegram:", error);
            document.getElementById('status-text').style.color = '#ff3333';
            document.getElementById('status-text').innerText = "Помилка мережі...";
        }
        setTimeout(checkTelegramUpdates, 2000);
    }

    checkTelegramUpdates();
    window.addEventListener('click', () => { console.log("Звук активовано"); }, { once: true });
</script>
</body>
</html>
